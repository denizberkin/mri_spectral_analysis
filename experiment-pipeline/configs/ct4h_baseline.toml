# Template the ct4h_*.toml run configs are generated from: copy it and change the experiment/run name,
# data.params.split_mode and data.params.directions. Keep every other key in step across the run configs.
[experiment]
name = "ct4h_baseline"                # dose-conditioned any-to-any translation, trained from scratch (no CT pretraining
                                      # exists, and the MRI checkpoints live in another intensity domain).
                                      # Held-out scanners: data.params.split_mode = "scanner". For the seen-scanner
                                      # comparison set split_mode = "repeat" and change the experiment name.
seed = 1
device = "cuda:0"
output_dir = "../runs"

[tracking]
name = "mlflow"

[tracking.params]
experiment_name = "ct4h-conditional-unet"
run_name = "ct4h_baseline"
tracking_uri = "sqlite:///mlflow.db"

[registry]
paths = [
  "../components/data/ct4h.py",
  "../components/models/conditional_unet.py",
  "../components/losses/reconstruction.py",
  "../components/training/task3.py",
]

[data]
name = "ct4h_paired"

[data.params]
split_mode = "scanner"        # "scanner": whole scanners held out (ct4h.data.utils.SCANNER_SPLIT); "repeat": repeats held out
directions = "any"            # "any" = all 20 dose pairs, "up" = denoising only (10), "down" = the ill-posed 10
recons = ["FBP"]              # add "IR", "DL" once they are registered and cached (source and target share one recon)
domain_scheme = "dose"        # 5 domains: 1, 3, 6, 10, 14 mGy. "scanner_dose" (65) tells the model the scanner
neighbours = 1                # 2.5D: slices z-1, z+1 as extra input channels (centre slice first). 0 = plain 2D
hu_window = [-160.0, 240.0]   # soft-tissue window: ~88% of all voxels fall in it and the main HU peaks agree across scanners, while the
                              # bright tail (above ~800 HU) differs by hundreds of HU per scanner. Metrics must use the same window.
                              # [-1000, 2000] is the authors' range, [-200, 600] a compromise that keeps some dense material.
z_range = [11, 304]           # slices with phantom: the first ~9 and last few are empty or wrapped round by the authors' circular roll
train_samples = 20000         # random items per epoch (scanner, dose pair, repeats and slice are all drawn)
validation_samples = 400      # fixed draw on the validation split
validation_target = "mean"    # validate against the mean of the split's repeats (low noise), not one noisy repeat; "repeat" = what training sees
batch_size = 16
num_workers = 8
seed = 1
patch_size = 256              # random crop for training; validation uses whole slices padded to a multiple of 16
horizontal_flip = 0.5
include_slice_pos = false
# cache_dir = "/home/ruru/Documents/deniz/CT/cache"   # or CT4H_CACHE_DIR in .env

[model]
name = "task3_conditional_unet"

[model.params]
input_channels = 3            # 1 + 2 * neighbours
output_channels = 1
num_domains = 5               # must match domain_scheme: dose = 5, scanner_dose = 65
base_channels = 32
max_channels = 512
levels = 4
residual_output = true        # starts at "return the centre slice", learns the change between doses
film_conditioning = true
slice_conditioning = false

[training]
name = "task3_unet_trainer"

[training.params]
pretrain_steps = 0
epochs = 30
learning_rate = 0.0001
beta1 = 0.9
beta2 = 0.999
save_every = 1
log_checkpoints = false
amp = true
progress = true
progress_interval = 5.0
early_stopping_patience = 0
early_stopping_min_delta = 0.0001
early_stopping_restore_best = true

[[losses]]
name = "task3_l1"
weight = 1.0

[[losses]]
name = "task3_ssim"
weight = 0.5
